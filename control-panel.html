<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="author" content="Mohammad Zamir Akbari"><meta name="author-url" content="https://z.akbari.org"><title>Quran Recitation Studio — Control Dock</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="dock"><header class="brand"><div class="mark">۞</div><div><h1 data-t="title">Quran Recitation Studio</h1><small data-t="subtitle">OBS-Steuerpanel</small></div></header>
<section class="card"><div class="section-top"><h2 data-t="language">Bedienoberfläche</h2><select id="lang" aria-label="Interface language"><option value="de">Deutsch</option><option value="en">English</option><option value="fa">فارسی / دری</option><option value="ar">العربية</option><option value="tr">Türkçe</option></select></div></section>
<section class="card"><h2 data-t="selection">Sure & Aya</h2><div class="columns"><div><label for="surah" data-t="surah">Sure</label><select id="surah"></select></div><div><label for="ayah" data-t="ayah">Aya</label><select id="ayah"></select></div><div><label for="reciter" data-t="reciter">Rezitator</label><select id="reciter"><option value="ar.alafasy">Mishary Alafasy</option><option value="ar.husary">Mahmoud Al-Husary</option><option value="ar.minshawi">Mohamed Al-Minshawi</option></select></div><div><label for="translation" data-t="translation">Übersetzung</label><select id="translation"><option value="de.bubenheim">Deutsch — Bubenheim / Elyas</option><option value="en.sahih">English — Saheeh International</option><option value="fa.fooladvand">فارسی — فولادوند</option><option value="tr.diyanet">Türkçe — Diyanet</option><option value="ur.jalandhry">اردو — جالندھری</option></select></div></div><div class="rowButtons"><button id="prev" data-t="prev">Vorherige Aya</button><button id="next" data-t="next">Nächste Aya</button></div><div class="rowButtons"><button id="show" class="primary" data-t="show">Einblenden</button><button id="hide" data-t="hide">Ausblenden</button></div><div class="rowButtons"><button id="play" class="primary" data-t="play">Rezitation starten</button><button id="pause" data-t="pause">Pause</button><button id="stop" class="warn" data-t="stop">Stopp</button></div></section>
<section class="card"><h2 data-t="display">Darstellung</h2><div class="columns"><div><label for="theme" data-t="theme">Design</label><select id="theme">
<option value="royal">Royal Blue / Gold</option>
<option value="emerald">Emerald Mosque</option>
<option value="gold">Golden Night</option>
<option value="kaaba">Kaaba Night</option>
<option value="ottoman">Ottoman Blue</option>
<option value="desert">Desert Noor</option>
<option value="arch">Royal Arch</option>
<option value="glass">Glass Mihrab</option>
<option value="parchment">Parchment Manuscript</option>
<option value="minimal">Minimal Noor</option>
</select></div><div><label for="animation" data-t="animation">Animation</label><select id="animation"><option value="slide">Slide</option><option value="fade">Fade</option><option value="zoom">Cinematic Zoom</option><option value="flip">3D Flip</option><option value="rise">Rise</option><option value="none">None</option></select></div><div class="wide"><label for="fontSize" data-t="fontSize">Arabische Schriftgröße</label><input type="range" id="fontSize" min="24" max="100" value="48"></div></div><label class="switch"><span data-t="showTranslation">Übersetzung anzeigen</span><input type="checkbox" id="showTranslation" checked></label><label class="switch"><span data-t="showReference">Sure und Aya anzeigen</span><input type="checkbox" id="showReference" checked></label><label class="switch"><span data-t="autoNext">Automatisch nächste Aya</span><input type="checkbox" id="autoNext"></label><div class="separator"></div><label for="volume" data-t="volume">Lautstärke</label><input type="range" id="volume" min="0" max="100" value="80"></section>
<section class="card"><h2 data-t="status">Status</h2><p class="note" data-t="instructions">Die Wiedergabe läuft in der OBS-Browserquelle. Aktiviere dort „Audio über OBS steuern“.</p><div class="status" id="status" aria-live="polite"></div></section></main><script src="assets/shared.js"></script><script src="assets/control.js"></script></body></html>
